syntax = "proto3";

option csharp_namespace = "Reviews.WebApi.Grpc";

package reviews;

// Service for querying reviews
service ReviewsGrpcService {
    rpc GetReviewsByProductId (GetReviewsByProductIdRequest) returns (ReviewsReply);
    rpc GetReviewById (GetReviewByIdRequest) returns (ReviewReply);
}

message GetReviewsByProductIdRequest {
    int64 product_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message GetReviewByIdRequest {
    string id = 1;
}

message ReviewReply {
    string id = 1;
    int64 product_id = 2;
    string product_name = 3;
    string author_name = 4;
    int32 rating = 5;
    string text = 6;
    int32 comments_count = 7;
    int32 version = 8;
    string created_at = 9;
}

message ReviewsReply {
    repeated ReviewReply items = 1;
}
